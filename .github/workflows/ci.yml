# SV-01: the backend suite, including the solver reference cases and the frozen results (SV-27), runs on every
# push and pull request. It uses the same `make test` as a developer machine: the tests image and an isolated
# PostgreSQL in Docker Compose, so CI cannot pass on a path a developer cannot reproduce.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (solver regression included)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Local configuration (secrets are generated, never committed)
        run: make local-config

      - name: Lint
        run: make lint

      - name: Tests
        # TEST_WORKERS is derived from the Docker engine's cores and memory; the runner has 4 cores.
        run: make test

      - name: Solver reference report
        if: always()
        run: |
          echo "Frozen solver results: $(python3 -c "import json; r=json.load(open('services/potential_engine/validation/frozen_results.json'))['records'][-1]; print(r['solver_version'], len(r['cases']), 'cases, frozen on', r['frozen_on'])")"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - run: make frontend-build
