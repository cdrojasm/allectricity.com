# Deploys to Railway production only what changed, and only after `ci` passed on main.
#  - Automatic: when `ci` finishes successfully on main. The services come from the files changed since the last
#    successful deploy (tag `deployed/production`), mapped by deploy/railway/changed_services.py. A failed deploy
#    leaves the tag where it was, so its changes go out with the next one.
#  - Manual (Actions → deploy → Run workflow): empty = by changes, "all" = every code service, or a list
#    ("api frontend").
# Needs the repository secret RAILWAY_TOKEN: a Railway *project* token for the production environment.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Vacío = según los cambios · "all" = todos · o una lista: "api frontend"'
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false            # never cut a deploy (and its migrations) in half

permissions:
  contents: write                      # move the deployed/production tag

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0               # the diff against the last deployed commit needs history

      - name: Check the service mapping
        run: python3 deploy/railway/changed_services.py --self-test

      - name: Choose services
        id: plan
        env:
          REQUESTED: ${{ github.event.inputs.services }}
        run: |
          ALL="api scheduler agent-worker document-worker calculation-worker optimizer-worker mail-worker render-worker potential-engine ocr minio frontend"
          if [ "$REQUESTED" = "all" ]; then
            SERVICES="$ALL"; WHY="todos (pedido manual)"
          elif [ -n "$REQUESTED" ]; then
            SERVICES="$REQUESTED"; WHY="pedido manual"
          elif git rev-parse -q --verify "refs/tags/deployed/production" >/dev/null; then
            BASE=$(git rev-parse deployed/production)
            SERVICES=$(git diff --name-only "$BASE" "$HEAD_SHA" | python3 deploy/railway/changed_services.py)
            WHY="cambios desde ${BASE:0:7}"
          else
            SERVICES="$ALL"; WHY="primer despliegue (no hay tag deployed/production)"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          {
            echo "### Despliegue de ${HEAD_SHA:0:7}"
            echo "Criterio: $WHY"
            echo "Servicios: ${SERVICES:-ninguno}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Railway CLI
        if: steps.plan.outputs.services != ''
        run: npm install -g @railway/cli@5.64.2

      - name: Deploy and wait
        if: steps.plan.outputs.services != ''
        env:
          SERVICES: ${{ steps.plan.outputs.services }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "::error::Falta el secreto RAILWAY_TOKEN"; exit 1; }
          python3 deploy/railway/deploy_services.py $SERVICES

      # A manual deploy of a few services leaves the tag alone: the other changes are still pending.
      - name: Mark as deployed
        if: github.event.inputs.services == '' || github.event.inputs.services == 'all'
        run: |
          git tag -f deployed/production "$HEAD_SHA"
          git push -f origin refs/tags/deployed/production
