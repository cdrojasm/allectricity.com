map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Same split as production: landing.localhost:3001 shows the landing, localhost:3001 the app.
map $host $is_landing {
    default 0;
    landing.localhost 1;
}

map $is_landing $entry_page {
    1 /landing.html;
    default /index.html;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS resolves service names and tracks container IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;
    set $minio_upstream minio:9000;
    set $mailpit_upstream mailpit:8025;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Presigned object-storage URLs use the same public host/port as this app.
    # Preserve the original bucket path and Host header so MinIO's signature matches.
    location ~ ^/(quarantine|documents|designs|plantillas)(/|$) {
        proxy_pass http://$minio_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mailpit stays internal to Docker; its development UI is available through Nginx.
    location ^~ /mailpit/ {
        proxy_pass http://$mailpit_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /docs {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    set $app_origin http://localhost:3001;
    location = / { try_files $entry_page =404; }
    # Public text pages (guide, terms, privacy) linked from the landing; served on every host. /docs is the API's Swagger UI.
    location ~ ^/(ayuda|terminos|privacidad)/?$ { try_files /paginas.html =404; }
    location / { try_files $uri @spa; }
    location @spa {
        if ($is_landing) { return 302 $app_origin$request_uri; }
        rewrite ^ /index.html break;
    }
}
