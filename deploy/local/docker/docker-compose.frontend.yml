name: grounding-design-ai-frontend
services:
  nginx:
    container_name: grounding-design-ai-nginx
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${SPAT_FRONTEND_PORT:-3001}:80"
    volumes:
      - ../../../app/dist:/usr/share/nginx/html:ro
      - ../../../app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  default:
    name: grounding-design-ai-network
    external: true
