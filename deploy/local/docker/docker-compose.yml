name: grounding-design-ai

x-backend: &backend
  image: grounding-design-ai-backend:${SPAT_IMAGE_TAG:-local}
  build:
    context: ../../..
    dockerfile: deploy/local/docker/Dockerfile.api
    target: runtime
  env_file:
    - ../../../.env
  environment:
    MINIO_ENDPOINT: minio:9000
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:19000}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-spatlocal}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-spat-local-minio-secret-please-change}
    MINIO_SECURE: "false"
    CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
    OCR_SERVICE_URL: http://ocr:8080
    PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://nginx:80}
    OCR_INTERNAL_API_TOKEN: ${OCR_INTERNAL_API_TOKEN:-${AUTH_JWT_SECRET:?Run make local-config}}
    MINIO_WEBHOOK_AUTH_TOKEN: ${MINIO_WEBHOOK_AUTH_TOKEN:-local-minio-webhook-secret-change-me}
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-neo4j-password-change-me}

services:
  ocr:
    container_name: grounding-design-ai-ocr
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.ocr
    environment:
      OCR_MIN_MEAN_CONFIDENCE: ${OCR_MIN_MEAN_CONFIDENCE:-60}
      OCR_MAX_LOW_CONFIDENCE_RATIO: ${OCR_MAX_LOW_CONFIDENCE_RATIO:-0.20}
      OCR_LOW_WORD_CONFIDENCE: ${OCR_LOW_WORD_CONFIDENCE:-45}
      OCR_MAX_IMAGE_BYTES: ${OCR_MAX_IMAGE_BYTES:-20971520}
      OCR_INTERNAL_API_TOKEN: ${OCR_INTERNAL_API_TOKEN:-${AUTH_JWT_SECRET:?Run make local-config}}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  postgres:
    container_name: grounding-design-ai-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spat}
      POSTGRES_USER: ${POSTGRES_USER:-spat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make local-config}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    container_name: grounding-design-ai-redis
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  neo4j:
    container_name: grounding-design-ai-neo4j
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-local-neo4j-password-change-me}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u '${NEO4J_USER:-neo4j}' -p '${NEO4J_PASSWORD:-local-neo4j-password-change-me}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio:
    container_name: grounding-design-ai-minio
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-spatlocal}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-spat-local-minio-secret-please-change}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://api:8000/api/v1/files/events/minio
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY: ${MINIO_WEBHOOK_AUTH_TOKEN:-local-minio-webhook-secret-change-me}
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: /data/.minio-events
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio-init:
    container_name: grounding-design-ai-minio-init
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY";
        mc mb --ignore-existing local/quarantine;
        mc mb --ignore-existing local/documents;
        mc mb --ignore-existing local/designs;
        mc mb --ignore-existing local/plantillas;
        mc mirror --overwrite --remove /seed/plantillas-medicion local/plantillas;
        mc anonymous set none local/quarantine;
        mc anonymous set none local/documents;
        mc anonymous set none local/designs;
        mc anonymous set none local/plantillas;
        mc event add local/quarantine arn:minio:sqs::PRIMARY:webhook --event put --ignore-existing
    volumes:
      - ../../../resources/minio:/seed:ro
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-spatlocal}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-spat-local-minio-secret-please-change}
    restart: "no"

  clamav:
    container_name: grounding-design-ai-clamav
    image: clamav/clamav-debian:1.4
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh --ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  mailpit:
    container_name: grounding-design-ai-mailpit
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${SPAT_MAIL_PORT:-18025}:8025"
    restart: unless-stopped

  migrate:
    container_name: grounding-design-ai-migrate
    <<: *backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    container_name: grounding-design-ai-api
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      ocr:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${SPAT_FRONTEND_PORT:-3000}:80"
    volumes:
      - ../../../app/dist:/usr/share/nginx/html:ro
      - ../../../app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    container_name: grounding-design-ai-worker
    <<: *backend
    command: ["celery", "-A", "src.infrastructure.entrypoint.worker.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      ocr:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    container_name: grounding-design-ai-scheduler
    <<: *backend
    command: ["celery", "-A", "src.infrastructure.entrypoint.worker.tasks:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/spat-celerybeat"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres-test:
    profiles: [test]
    container_name: grounding-design-ai-postgres-test
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grounding_design_ai_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d grounding_design_ai_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    profiles: [test]
    container_name: grounding-design-ai-tests
    image: grounding-design-ai-tests:local
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.api
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://test:isolated-test-only@postgres-test:5432/grounding_design_ai_test
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-data:
    name: grounding-design-ai-postgres-data
  redis-data:
    name: grounding-design-ai-redis-data
  minio-data:
    name: grounding-design-ai-minio-data
  neo4j-data:
    name: grounding-design-ai-neo4j-data

networks:
  default:
    name: grounding-design-ai-network
