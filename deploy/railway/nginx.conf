server {
    listen 80;
    server_name _;

    resolver 8.8.8.8 valid=10s ipv6=off;
    set $api_upstream api.railway.internal:8000;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs { proxy_pass http://$api_upstream$request_uri; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://$api_upstream$request_uri; proxy_set_header Host $host; }
    location = /health { proxy_pass http://$api_upstream$request_uri; proxy_set_header Host $host; }
    location = /ready { proxy_pass http://$api_upstream$request_uri; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
