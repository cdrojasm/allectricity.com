[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spat-design-agent"
version = "0.1.0"
description = "Agente de diseño y validación de sistemas de puesta a tierra."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "celery[redis]>=5.4,<6",
  "cryptography>=43,<51",
  "google-auth[requests]>=2.35,<3",
  "email-validator>=2.2,<3",
  "minio>=7.2,<8",
  "python-magic>=0.4.27,<1",
  "pypdf>=5.0,<7",
  "pypdfium2>=4.30,<6",
  "pdfplumber>=0.11,<1",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "jsonschema>=4.21,<5",
  "neo4j>=5.26,<7",
  "pillow>=10,<13",
  "langfuse>=4,<5",
  "openai>=1.68,<3",
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
parsers = ["ezdxf>=1.3"]
reports = ["reportlab>=4.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.domain.spat" = ["schemas/*.json"]
